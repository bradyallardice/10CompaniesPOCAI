[tool:pytest]
# Pytest configuration for Stage 6 tests
# Enforces fail-fast discipline with warnings as errors

# Treat warnings as errors (fail-fast)
filterwarnings = error

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts = -v --tb=short --strict-markers

# Markers for test organization
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for component interaction  
    cli: Command line interface tests
    failfast: Tests for error handling and fail-fast behavior
    golden: Tests that compare against golden output files
    slow: Slow tests that may take longer to run

# Minimum coverage thresholds
# (Uncomment when coverage measurement is added)
# --cov=stage_6_link_exposure_to_jobs
# --cov-fail-under=90